name: arrows
description: A minimalist snake-line untangle logic puzzle game.
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

# State Management & Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1

# Rendering & Animation Foundations
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  confetti: ^0.8.0

# Monetization
  google_mobile_ads: ^7.0.0
  flutter_animate: ^4.5.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    # - assets/images/
    # - assets/audio/
    - assets/levels/
